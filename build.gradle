plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.111'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client { client() }
        server { server() }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Coloque na pasta libs/ os .jar que o seu modpack usa:
    //   - Alex's Caves (Unofficial Port) do Raguto
    //   - Citadel (Unofficial Port)
    // So servem para compilar; no jogo eles ja estao na pasta mods.
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
